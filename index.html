$('mf').onsubmit=e=>{e.preventDefault();if(op())return toast('Cierra la jornada antes de actualizar');const a=pm($('mw').value),b=pm($('mb').value);if(isNaN(a)||isNaN(b)||a>3360||b>5400||b<a)return toast('Valores no válidos');S.tach.manual={at:new Date().toISOString(),weekly:a,prev:b-a};save();e.target.reset();rTach()};

$('sp').oninput=()=>$('ix').style.display=$('sp').value.trim().toUpperCase()!=S.plate?'block':'none';
$('sf').onsubmit=e=>{e.preventDefault();const p=$('sp').value.trim().toUpperCase();if(p!=S.plate){const w=pm($('iw').value),b=pm($('ib').value);if(isNaN(w)||isNaN(b)||w>3360||b>5400||b<w)return toast('Revisa conducción semanal y bisemanal');const at=new Date().toISOString();S.tach={manual:{at,weekly:w,prev:b-w},init:{at,ten:+$('it').value||0,reduced:+$('ir').value||0,restEnd:$('ie').value||null}};['iw','ib','ie'].forEach(x=>$(x).value='')}S.plate=p;save();show('home')};

$('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);d=d.data||d;if(!Array.isArray(d.journeys)||!Array.isArray(d.fuels))throw 0;if(d.journeys.some(j=>j.startDate))d=migrate(d);if(!confirm(tr('Se sustituirán los datos actuales. ¿Continuar?')))return;S=Object.assign({plate:'',periodDay:26,resets:{},tach:{}},d);save();toast('Copia importada')}catch(x){toast('Archivo no válido')}e.target.value=''};r.readAsText(f)};
